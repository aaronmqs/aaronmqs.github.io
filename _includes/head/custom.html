{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="preload" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css"></noscript>

<!-- Support for Font Awesome -->
 <link rel="preload" href="{{ base_path }}/assets/css/fontawesome.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ base_path }}/assets/css/fontawesome.css"></noscript>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="var(--global-bg-color)"/>

<!-- Handle that hides or shows the author sidebar; the choice is kept in this browser.
     It is built here, not in the footer, because the footer is hidden by the custom styles. -->
<script>
document.addEventListener('DOMContentLoaded', function () {
  var LEFT = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M6.5 1.5 L3 5 L6.5 8.5"/></svg>';
  var RIGHT = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M3.5 1.5 L7 5 L3.5 8.5"/></svg>';
  var btn = document.createElement('button');
  btn.id = 'sidebar-toggle';
  btn.type = 'button';
  document.body.appendChild(btn);
  var lines = ['is-top', 'is-bottom'].map(function (cls) {
    var d = document.createElement('div');
    d.className = 'sidebar-divider ' + cls;
    document.body.appendChild(d);
    return d;
  });

  function photoCentre() {
    var body = document.body;
    var wasHidden = body.classList.contains('sidebar-hidden');
    if (wasHidden) body.classList.remove('sidebar-hidden');
    var best = null;
    Array.prototype.forEach.call(document.querySelectorAll('.sidebar img'), function (im) {
      var r = im.getBoundingClientRect();
      if (r.height > 0 && r.width > 0 && (!best || r.height > best.height)) best = r;
    });
    if (wasHidden) body.classList.add('sidebar-hidden');
    return best ? best.top + best.height / 2 : window.innerHeight / 2;
  }

  function place() {
    var hidden = document.body.classList.contains('sidebar-hidden');
    var main = document.querySelector('.page') || document.querySelector('.archive');
    var bar = document.querySelector('.sidebar');
    var x;
    if (hidden && main) {
      x = main.getBoundingClientRect().left - 26;
    } else if (bar) {
      var r = bar.getBoundingClientRect();
      x = r.right + 4;
      if (main) {
        x = Math.min(x, main.getBoundingClientRect().left - 22);
      }
    }
    if (x === undefined) return;
    var left = Math.max(4, x);
    btn.style.left = left + 'px';

    /* keep the handle level with the photo, in both states */
    var y = photoCentre();
    btn.style.top = y + 'px';

    var head = document.querySelector('.masthead');
    var top0 = head ? head.getBoundingClientRect().bottom + 10 : 70;
    var half = btn.offsetHeight / 2 + 10;
    lines.forEach(function (d) { d.style.left = (left + 9) + 'px'; });
    lines[0].style.top = top0 + 'px';
    lines[0].style.height = Math.max(0, y - half - top0) + 'px';
    lines[1].style.top = (y + half) + 'px';
  }

  function paint(hidden) {
    document.body.classList.toggle('sidebar-hidden', hidden);
    btn.innerHTML = hidden ? RIGHT : LEFT;
    var label = hidden ? 'Show the profile column' : 'Hide the profile column';
    btn.title = label;
    btn.setAttribute('aria-label', label);
    place();
  }

  var saved = false;
  try { saved = localStorage.getItem('sidebarHidden') === '1'; } catch (e) {}
  paint(saved);

  /* the same control for the contents box, when the page has one */
  if (document.querySelector('.sidebar__right')) {
    var tocBtn = document.createElement('button');
    tocBtn.id = 'toc-toggle';
    tocBtn.type = 'button';
    document.body.appendChild(tocBtn);
    var placeToc = function () {
      var hidden = document.body.classList.contains('toc-hidden');
      var box = document.querySelector('.sidebar__right');
      var r = box ? box.getBoundingClientRect() : null;
      if (hidden || !r || r.width === 0) {
        tocBtn.style.left = (window.innerWidth - 28) + 'px';
        tocBtn.style.top = '140px';
      } else {
        tocBtn.style.left = (r.left - 9) + 'px';
        tocBtn.style.top = (r.top + 30) + 'px';
      }
    };
    var paintToc = function (hidden) {
      document.body.classList.toggle('toc-hidden', hidden);
      tocBtn.innerHTML = hidden ? LEFT : RIGHT;
      var lab = hidden ? 'Show the contents' : 'Hide the contents';
      tocBtn.title = lab;
      tocBtn.setAttribute('aria-label', lab);
      place();
      placeToc();
    };
    var savedToc = false;
    try { savedToc = localStorage.getItem('tocHidden') === '1'; } catch (e) {}
    paintToc(savedToc);
    tocBtn.addEventListener('reposition', placeToc);
    window.addEventListener('load', placeToc);
    setTimeout(placeToc, 400);
    tocBtn.addEventListener('click', function () {
      paintToc(!document.body.classList.contains('toc-hidden'));
      try { localStorage.setItem('tocHidden', document.body.classList.contains('toc-hidden') ? '1' : '0'); } catch (e) {}
    });
  }
  window.addEventListener('resize', function () {
    place();
    var b = document.getElementById('toc-toggle');
    if (b) b.dispatchEvent(new Event('reposition'));
  });
  window.addEventListener('load', place);
  setTimeout(place, 400);
  btn.addEventListener('click', function () {
    paint(!document.body.classList.contains('sidebar-hidden'));
    try { localStorage.setItem('sidebarHidden', document.body.classList.contains('sidebar-hidden') ? '1' : '0'); } catch (e) {}
  });
});
</script>

<!-- end custom head snippets -->
