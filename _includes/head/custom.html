<!-- Support for Font Awesome -->
 <link rel="preload" href="{{ base_path }}/assets/css/fontawesome.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ base_path }}/assets/css/fontawesome.css"></noscript>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>

<meta name="theme-color" content="var(--global-bg-color)"/>

<!-- Handle that hides or shows the author sidebar; the choice is kept in this browser.
     It is built here, not in the footer, because the footer is hidden by the custom styles. -->
<script>
document.addEventListener('DOMContentLoaded', function () {
  var LEFT = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M6.5 1.5 L3 5 L6.5 8.5"/></svg>';
  var RIGHT = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M3.5 1.5 L7 5 L3.5 8.5"/></svg>';
  var btn = document.createElement('button');
  btn.id = 'sidebar-toggle';
  btn.type = 'button';
  document.body.appendChild(btn);
  var lines = ['is-top', 'is-bottom'].map(function (cls) {
    var d = document.createElement('div');
    d.className = 'sidebar-divider ' + cls;
    document.body.appendChild(d);
    return d;
  });

  function place() {
    var hidden = document.body.classList.contains('sidebar-hidden');
    var main = document.querySelector('.page') || document.querySelector('.archive');
    var bar = document.querySelector('.sidebar');
    var x;
    if (hidden && main) {
      x = main.getBoundingClientRect().left - 26;
    } else if (bar) {
      var r = bar.getBoundingClientRect();
      x = r.right + 4;
      if (main) {
        x = Math.min(x, main.getBoundingClientRect().left - 22);
      }
    }
    if (x === undefined) return;
    var left = Math.max(4, x);
    btn.style.left = left + 'px';

    // centre the handle on the profile photo, and cut the divider around it
    var y = window.innerHeight / 2;
    if (!hidden) {
      var best = null;
      Array.prototype.forEach.call(document.querySelectorAll('.sidebar img'), function (im) {
        var r = im.getBoundingClientRect();
        if (r.height > 0 && r.width > 0 && (!best || r.height > best.height)) best = r;
      });
      if (best) y = best.top + best.height / 2;
    }
    btn.style.top = y + 'px';

    var head = document.querySelector('.masthead');
    var top0 = head ? head.getBoundingClientRect().bottom + 10 : 70;
    var half = btn.offsetHeight / 2 + 10;
    lines.forEach(function (d) { d.style.left = (left + 9) + 'px'; });
    lines[0].style.top = top0 + 'px';
    lines[0].style.height = Math.max(0, y - half - top0) + 'px';
    lines[1].style.top = (y + half) + 'px';
  }

  function paint(hidden) {
    document.body.classList.toggle('sidebar-hidden', hidden);
    btn.innerHTML = hidden ? RIGHT : LEFT;
    var label = hidden ? 'Show the profile column' : 'Hide the profile column';
    btn.title = label;
    btn.setAttribute('aria-label', label);
    place();
  }

  var saved = false;
  try { saved = localStorage.getItem('sidebarHidden') === '1'; } catch (e) {}
  paint(saved);
  window.addEventListener('resize', place);
  window.addEventListener('load', place);
  setTimeout(place, 400);
  btn.addEventListener('click', function () {
    paint(!document.body.classList.contains('sidebar-hidden'));
    try { localStorage.setItem('sidebarHidden', document.body.classList.contains('sidebar-hidden') ? '1' : '0'); } catch (e) {}
  });
});
</script>

<!-- end custom head snippets -->
